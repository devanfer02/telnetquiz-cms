services:
  cms:
    image: ghcr.io/devanfer02/telnetquiz-cms:${TAG:-latest}
    container_name: telnetquiz-cms
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - path: ./.env
        required: true
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - TTS_SERVICE_URL=http://tts-api:8000
    restart: unless-stopped
    depends_on:
      tts-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  tts-api:
    image: ghcr.io/devanfer02/telnetquiz-tts:${TAG:-latest}
    container_name: telnetquiz-tts
    build:
      context: ./tts-api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: ./tts-api/.env
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
