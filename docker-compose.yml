services:
  tts-api:
    build:
      context: ./tts-api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: ./tts-api/.env
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
