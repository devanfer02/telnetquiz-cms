worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    server_tokens off;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;

    keepalive_timeout  30s;
    keepalive_requests 100;

    # Slow-loris hardening
    client_body_timeout   10s;
    client_header_timeout 10s;
    send_timeout          10s;
    reset_timedout_connection on;

    # Body size: bump if you upload large assets through the proxy
    client_max_body_size   10m;
    client_body_buffer_size 16k;
    large_client_header_buffers 4 8k;

    # Compression
    gzip               on;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_comp_level    6;
    gzip_min_length    1024;
    gzip_types         text/plain text/css text/xml text/javascript
                       application/json application/javascript application/xml
                       application/xml+rss application/wasm image/svg+xml;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_host" "$http_referer" "$http_user_agent" '
                    'rt=$request_time urt="$upstream_response_time"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Rate-limit zones
    limit_req_zone  $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=auth:10m    rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conns:10m;

    # If you put another LB / Cloudflare in front, list its CIDRs here so
    # rate limiting keys off the real client IP, not the LB.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    upstream cms_upstream {
        server cms:3000;
        keepalive 32;
    }

    # Default server: any request whose Host header is NOT telnetquiz.ferrel.dev
    # (raw IP probes, scanners, mismatched DNS) gets dropped without a response.
    server {
        listen      80 default_server;
        server_name _;
        return      444;
    }

    server {
        listen      80;
        server_name telnetquiz.ferrel.dev;

        # Security headers
        add_header X-Frame-Options        "SAMEORIGIN"                       always;
        add_header X-Content-Type-Options "nosniff"                          always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;
        add_header X-XSS-Protection       "1; mode=block"                    always;
        add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;

        # Per-IP connection cap
        limit_conn conns 20;

        # HTTP method allowlist
        if ($request_method !~ ^(GET|POST|PUT|PATCH|DELETE|OPTIONS|HEAD)$) {
            return 405;
        }

        # Block common scanner / leak paths
        location ~* /(\.git|\.env|\.svn|\.hg|\.DS_Store|wp-admin|wp-login|phpmyadmin|xmlrpc\.php) {
            deny all;
            return 404;
        }

        # Cheap proxy-level health endpoint
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Stricter limit on auth surface (Better Auth lives at /api/auth/*)
        location ^~ /api/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://cms_upstream;
            include    /etc/nginx/snippets/proxy.conf;
        }

        # Everything else
        location / {
            limit_req zone=general burst=60 nodelay;
            proxy_pass http://cms_upstream;
            include    /etc/nginx/snippets/proxy.conf;
        }
    }

    # --- TLS template (uncomment once you mount certs) -----------------
    # server {
    #     listen 443 ssl http2;
    #     server_name telnetquiz.ferrel.dev;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     # ... copy the location blocks from the :80 server above ...
    # }
    #
    # server {
    #     listen 443 ssl http2 default_server;
    #     ssl_reject_handshake on;
    # }
}
